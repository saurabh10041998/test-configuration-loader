[package]
name = "unified-config-loader"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration_tests"
path = "integration/integration_tests.rs"

[[example]]
name = "app_config_demo"
path = "examples/app_config_demo/main.rs"
